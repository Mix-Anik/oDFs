name: physics

# Replays the golden files (movement and gameplay recorded on the original DeFRaG) through the game QVM built from
# this commit. A step that matched the recording when the file was made and does not any more fails the run.
# See testing/README.md.

on:
  push:
  pull_request:

jobs:
  golden:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tools
        shell: bash
        run: |
          gcc --version
          cmake --version
          python --version

      # The golden files are zlib streams: install zlib when the compiler on the runner does not already have it.
      - name: zlib
        shell: bash
        run: |
          if echo '#include <zlib.h>
          int main(void) { return zlibVersion()[0] == 0; }' | gcc -x c - -lz -o zlibprobe.exe; then
            echo "zlib is available to gcc"
          else
            echo "installing zlib (msys2)"
            /c/msys64/usr/bin/pacman -S --noconfirm --needed mingw-w64-x86_64-zlib
            echo "CMAKE_EXTRA_ARGS=-DZLIB_ROOT=C:/msys64/mingw64" >> "$GITHUB_ENV"
          fi

      - name: Build and replay the golden files
        shell: bash
        run: bash testing/ci.sh
