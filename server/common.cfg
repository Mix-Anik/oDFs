// ---- network / listing ----
set sv_maxclients 32
set sv_maxclientsPerIP 3
set sv_floodProtect 1
set sv_fps 125

// ---- admin ----
// An empty g_password = public server
set rconPassword "changeme"
set g_password ""

// ---- downloads: players fetch zzz-defrag_vm.pk3 and the maps from the server over the game port ----
set sv_allowDownload 1
set sv_dlRate 100
set sv_pure 0

// ---- rules ----
// df_forceCvars 1: g_speed 320, g_gravity 800, g_knockback 1000, dmflags 0, fraglimit 0 ... forced on every map load
set df_forceCvars 1
// df_gametype 0 = decide from the map (start timer: run, team items: fastcaps, otherwise tricks), 1 run, 2 tricks, 3 fastcaps
set df_gametype 1
set df_ob_KillOBs 0
set g_doWarmup 0
set timelimit 0

// ---- voting (F1 yes / F2 no) ----
set df_vote_system 1
set df_vote_allowVotes 1
set df_vote_voteDelay 20
set df_vote_allow_devmap 1
set df_vote_allow_gametype 0
set df_vote_allow_interference 0

// ---- logging ----
set g_log "games.log"
set g_logSync 0
